<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 175" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090C12"/>
      <stop offset="50%" stop-color="#111726"/>
      <stop offset="100%" stop-color="#090C12"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="45%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="bellFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.0"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.05"/>
    </pattern>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Consolas, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
      .dot { animation: pulse 2s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Card Background -->
  <rect x="2" y="2" width="896" height="171" rx="16" fill="url(#bg)" stroke="url(#borderGrad)" stroke-width="1.5"/>
  <rect x="2" y="2" width="896" height="171" rx="16" fill="url(#dots)"/>

  <!-- Left Content -->
  <g transform="translate(36, 32)">
    <!-- Status Pill -->
    <rect x="0" y="0" width="380" height="24" rx="12" fill="#131B2E" stroke="#1E293B" stroke-width="1"/>
    <circle cx="14" cy="12" r="4" fill="#34D399" class="dot"/>
    <text x="26" y="16" class="mono" font-size="11" fill="#94A3B8">B.Tech '28 · IIT Jodhpur · Open to DS / ML Internships</text>

    <!-- Name -->
    <text x="0" y="68" class="sans" font-size="40" font-weight="800" letter-spacing="-0.8" fill="url(#titleGrad)">Arnav Sharma</text>

    <!-- Role Subtitle -->
    <text x="0" y="96" class="mono" font-size="14.5" font-weight="500" fill="#94A3B8">
      Data Science &amp; ML Engineer building <tspan fill="#38BDF8" font-weight="600">Multi-Agent LLMs</tspan> &amp; <tspan fill="#A78BFA" font-weight="600">Statistical Systems</tspan>
    </text>

    <!-- Tagline -->
    <text x="0" y="120" class="sans" font-size="13.5" fill="#64748B">
      Engineering end-to-end ML pipelines, adversarial red-team harnesses, and verifiable AI workflows
    </text>
  </g>

  <!-- Right Gaussian Bell Curve Emblem -->
  <g transform="translate(730, 24)">
    <rect x="0" y="0" width="132" height="126" rx="14" fill="#0D1322" stroke="url(#borderGrad)" stroke-width="1.2"/>
    <path d="M 16 92 C 40 92, 48 26, 66 26 C 84 26, 92 92, 116 92 Z" fill="url(#bellFill)"/>
    <line x1="47" y1="48" x2="47" y2="92" stroke="#818CF8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="85" y1="48" x2="85" y2="92" stroke="#818CF8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <path d="M 16 92 C 40 92, 48 26, 66 26 C 84 26, 92 92, 116 92" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="66" cy="26" r="3.5" fill="#F8FAFC"/>
    <text x="66" y="112" text-anchor="middle" class="mono" font-size="10" fill="#64748B">arnav.sharma()</text>
  </g>
</svg>
